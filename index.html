<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Conhecimento</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#eeeeee;
    color:#222;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .wrap{
    width:100%;
    max-width:480px;
  }

  .card{
    background:#ffffff;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    padding:36px 28px 32px;
  }

  .title{
    font-size:32px;
    font-weight:800;
    text-align:center;
    color:#1a1a1a;
    line-height:1.25;
    margin:0 0 26px;
  }

  .q-text{
    font-size:19px;
    font-weight:500;
    line-height:1.45;
    text-align:center;
    color:#444;
    margin:0 0 28px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:#4f93e0;
    border:none;
    border-radius:12px;
    padding:16px 18px;
    color:#ffffff;
    font-family:inherit;
    font-size:15.5px;
    font-weight:500;
    line-height:1.4;
    cursor:pointer;
    transition:filter 0.15s ease, transform 0.08s ease;
  }
  .opt:hover:not(:disabled){ filter:brightness(1.05); }
  .opt:active:not(:disabled){ transform:scale(0.99); }
  .opt:focus-visible{ outline:2px solid #1a1a1a; outline-offset:2px; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:#5cb87a; }
  .opt.wrong{ background:#e06070; }

  .feedback-line{
    margin-top:22px;
    min-height:24px;
    font-size:17px;
    font-weight:700;
    text-align:center;
  }
  .feedback-line.ok{ color:#3d9a5c; }
  .feedback-line.err{ color:#d8394c; }

  .next-btn{
    display:block;
    margin:18px auto 0;
    font-weight:600;
    font-size:15px;
    color:#fff;
    background:#6b7280;
    border:none;
    border-radius:12px;
    padding:14px 28px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .next-btn:hover{ background:#565d66; }

  .start-btn, .restart-btn{
    display:block;
    margin:8px auto 0;
    font-weight:700;
    font-size:16px;
    color:#fff;
    background:#4f93e0;
    border:none;
    border-radius:12px;
    padding:15px 30px;
    cursor:pointer;
    transition:filter 0.15s ease;
  }
  .start-btn:hover, .restart-btn:hover{ filter:brightness(1.05); }

  .center-text{
    text-align:center;
    color:#666;
    font-size:15px;
    margin:0 0 22px;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <div id="startCard">
      <h1 class="title">Quiz de<br>Conhecimento</h1>
      <p class="center-text">140 perguntas em ordem aleatória.</p>
      <button class="start-btn" id="startBtn">Começar Quiz</button>
    </div>

    <div id="quizCard" class="hidden">
      <h1 class="title">Quiz de<br>Conhecimento</h1>
      <p class="q-text" id="qText">Carregando...</p>
      <div class="options" id="qOptions"></div>
      <p class="feedback-line" id="feedback"></p>
      <button class="next-btn hidden" id="nextBtn">Próxima Questão</button>
    </div>

    <div id="resultCard" class="hidden">
      <h1 class="title">Quiz<br>Concluído</h1>
      <p class="center-text">Você respondeu todas as perguntas.</p>
      <button class="restart-btn" id="restartBtn">Refazer em Nova Ordem</button>
    </div>

  </div>
</div>

<script>

e papelão no corredor."], "correct": 2}, {"q": "O que é Picking List?", "options": ["É um sistema eletrônico que verifica a posição das peças no estoque.", "É um sistema informatizado para indicar o controle de processo no abastecimento de linha.", "É um sistema informatizado para indicar as peças que não deverão ser montadas.", "Lista de materiais e quantidades necessárias para atender a ordem de produção ou entrega."], "correct": 3}, {"q": "Conforme IATF 16949, item 8.5.4.1 (Preservação – suplemento), a organização deve usar um sistema de gestão de inventário para otimizar o giro do estoque ao longo do tempo e assegurar a rotação do estoque, isto é:", "options": ["Avaliar em intervalos planejados apropriados a condição do produto no giro do estoque.", "Assegurar a preservação, embalagem, expedição e rotulagem, como providos pelos clientes.", "Assegurar a identificação, armazenamento e manuseio, desde a expedição até a entrega/aceitação pelo cliente.", "Utilizar a metodologia FIFO (Primeiro que entra – primeiro que sai)."], "correct": 3}, {"q": "Conforme descrito no Plano de Controle quando a frequência solicita, por exemplo, enviar 1 peça para ensaio metalúrgico, isso significa que:", "options": ["Deve-se enviar como Ajuste de Máquina.", "Deve-se enviar como variação de processo.", "Deve-se enviar como Periódico/Setup.", "Deve-se enviar como Experiência."], "correct": 2}, {"q": "Conforme definição da documentação IT-VE-001 utilizada para características especiais, a simbologia “C” significa:", "options": ["Pode continuar o processo.", "Pode afetar segurança.", "Pode afetar a função.", "Nenhuma das anteriores."], "correct": 1}, {"q": "Conforme definição da documentação IT-VE-001 utilizada para características especiais, a simbologia “F” significa:", "options": ["Pode afetar a função.", "Pode afetar o processo.", "Pode afetar a segurança.", "Nenhuma das anteriores."], "correct": 0}, {"q": "Quando o PPAP é realizado?", "options": ["Quando temos problemas de qualidade no produto.", "Quando cliente solicita ou o fornecedor deseja fazê-lo.", "Quando a máquina não tem capabilidade.", "Quando o produto está em processo de aprovação para fornecimento ao cliente."], "correct": 3}, {"q": "Ferramenta da qualidade conhecida como diagrama de causa e efeito ou “espinha de peixe”:", "options": ["Diagrama de Pareto.", "Histograma.", "Diagrama de Ishikawa.", "Fluxograma."], "correct": 2}, {"q": "Alguns fatores podem nos levar à uma leitura equivocada nas medições analógicas, como por exemplo:", "options": ["Parafuso de fixação travado.", "Erro de paralaxe.", "Não existem erros para este caso.", "Utilizar micrometro decimal quando é solicitado centesimal."], "correct": 1}, {"q": "Quando detectamos cestos ou separadores danificados, devemos:", "options": ["Interditar o cesto ou separadores e solicitar outro para logística.", "Continuar trabalhando normalmente.", "Alojar as peças com cuidado.", "Solicitar outro cesto e empilhar as peças."], "correct": 0}, {"q": "Conforme D SRC2 17 02, quando detectamos produtos vencidos (ex: graxa), devemos:", "options": ["Interditar e informar o time de qualidade.", "Descartar e solicitar novo produto.", "Utilizar e avisar o superior.", "Solicitar novo produto apenas após acabar o vencido."], "correct": 0}, {"q": "Quando temos produtos semelhantes próximos nas prateleiras, devemos:", "options": ["Analisar criticamente e verificar se são intercambiáveis.", "Solicitar a troca de posição de um dos produtos para evitar mistura.", "Avaliar se o material está embalado.", "Todas estão corretas."], "correct": 1}, {"q": "Quando realizamos a compra de peças com o sistema supermercado, devemos:", "options": ["Não utilizar o pick list.", "Coletar dois itens por compra.", "Coletar itens deixando as peças interditadas.", "Coletar os itens identificados pelo pick list, uma peça por compra."], "correct": 3}, {"q": "Conforme a diretiva DN BRA 17-23, a Ação Preventiva é:", "options": ["Ação para eliminar a causa de uma NC e prevenir recorrência.", "Ação para eliminar uma NC identificada.", "Ação para eliminar a causa de um potencial não conformidade ou outra situação potencialmente indesejável.", "Todas estão corretas."], "correct": 2}, {"q": "Em que momento o operacional deve-se consultar a documentação de processo?", "options": ["Somente no setup.", "Somente inspeção de processo.", "Em qualquer momento, os documentos são para suportar a processo.", "No final do lote."], "correct": 2}, {"q": "Conforme a diretiva DN BRA 17-23, a Ação Corretiva é:", "options": ["Ação para eliminar a causa de uma não conformidade para prevenir recorrência.", "Ação para eliminar uma não conformidade identificada.", "Ação para eliminar a causa de uma potencial NC.", "Todas estão corretas."], "correct": 0}, {"q": "Qual o objetivo da Ação de Contenção?", "options": ["Eliminar a causa de um potencial NC.", "Eliminar uma não conformidade identificada.", "Eliminar a causa de uma NC e prevenir recorrência.", "Todas estão corretas."], "correct": 1}, {"q": "O critério de abertura de nota D2 para falhas internas é:", "options": ["100% das falhas detectadas entre áreas.", "100% das falhas na área que requerem contenção fora do posto.", "D2 não é requerido para falhas de setup/peça danificada.", "Todas estão corretas."], "correct": 3}, {"q": "Conforme o PO, Controle de Produto não-conforme é:", "options": ["Produto com situação suspeita não classificado como NC.", "Ação para tornar o produto conforme.", "Produto ou material que não estão conforme com seus requisitos ou especificações estabelecidas, deve ser identificado e controlado para prevenir seu uso ou entrega não pretendido.", "Todas estão corretas."], "correct": 2}, {"q": "Conforme definição da PO, Retrabalho é:", "options": ["Produto com situação não identificada.", "Ação sobre um produto ou serviço não conforme, a fim de torná-lo conforme aos requisitos. Re-inspeções deve ser considerada como retrabalho.", "Ação para impedir a utilização prevista originalmente.", "Todas estão corretas."], "correct": 1}, {"q": "Mudança provisória no processo produtivo (máquina, ferramental), o solicitante deve emitir:", "options": ["Uma nota D2.", "Um 5W2H.", "Um A3.", "Um Desvio de Processo."], "correct": 3}, {"q": "Qual o objetivo de se realizar o teste de Poka Yoke antes de iniciar o turno?", "options": ["Evitar apontamento em auditorias.", "Produzir peça NC e enviar ao cliente.", "Não produzir peça/produto não conforme e enviar ao cliente.", "Evitar apontamento em inspeção volante."], "correct": 2}, {"q": "Qual impacto de se utilizar o RG (Funcional) de outro colega na operação?", "options": ["Perder rastreabilidade.", "Medidas disciplinares.", "Violar código de conduta.", "Todas estão corretas."], "correct": 3}, {"q": "Atividades e passos do operador ao utilizar o Poka Yoke:", "options": ["Simular erro no início de cada turno.", "Parar processo em caso de anormalidade.", "Só voltar se o Poka Yoke estiver OK.", "Todas estão corretas."], "correct": 3}, {"q": "Consequências do envio de uma peça sem tratamento térmico:", "options": ["Risco de quebra, danos e acidente ao usuário final.", "Aumento da durabilidade.", "Melhora a condição de montagem.", "Nenhuma das anteriores."], "correct": 0}, {"q": "Antes de iniciar a produção (Setup), o que deve ser feito?", "options": ["Registrar liberação só se necessário.", "Realizar e registrar a liberação do processo – set-up, fazer apontamento de todas as características solicitada em relatório.", "Não fazer apontamentos dimensionais.", "Nenhuma das anteriores."], "correct": 1}, {"q": "Produto suspeito se define por:", "options": ["Produto com uma situação não identificada, o qual deve ser controlado como produto não conforme.", "Produto devolvido para embalagem e fluxo normal.", "Produto que não está conforme.", "Todas estão incorretas."], "correct": 0}, {"q": "Onde podemos aplicar o Poka Yoke?", "options": ["Só para peças metálicas.", "Só divergência dimensional.", "Em operações onde existem peças semelhantes e em grande quantidade.", "Todas estão incorretas."], "correct": 2}, {"q": "Por que os 8D’s devem ser desenvolvidos por um time multifuncional?", "options": ["Mostrar participação ao cliente.", "Garantir participação de todas as áreas uma vez.", "Garantir os 8 passos.", "Porque precisamos garantir a resolução da causa raiz com as maiores eficiências e eficácias possíveis."], "correct": 3}, {"q": "Para regiões usinadas não pintadas nos agregados:", "options": ["Passar óleo protetivo.", "Passar solvente.", "Não é necessária limpeza.", "Verificar roscas."], "correct": 0}, {"q": "Principais contaminantes que afetam a graxa:", "options": ["Outro lubrificante.", "Água e sujidade.", "Particulados de metais.", "Todas estão corretas."], "correct": 3}, {"q": "Como detectar falha de usinagem ou falta de operação?", "options": ["Salt spray.", "Realizando inspeção visual 100% em todos os produtos antes de entregarmos ao próximo processo.", "Laminação.", "Inspeção visual só no Tratamento Térmico."], "correct": 1}, {"q": "Importância da instrução de trabalho (IT):", "options": ["Modo correto de execução.", "Unifica conhecimento e aumenta segurança.", "Passo a passo detalhado.", "Todas estão corretas."], "correct": 3}, {"q": "O que fazer quando derrubar ou bater uma peça?", "options": ["Colocar de volta no rack.", "Identificar e segregar a peça, acionar o Monitor de Equipe ou a área da Qualidade.", "Retrabalhar sem avisar.", "Deixar para o próximo turno."], "correct": 1}, {"q": "Uma batida na esfera e rosca causa:", "options": ["Sérios transtornos na linha de montagem e em nossos clientes.", "Engate e problemas ambientais.", "Nenhum dano.", "Porosidade."], "correct": 0}, {"q": "Como deve ser a ação de contenção para produto NC?", "options": ["Checar setor e estoque.", "Verificar tratamento térmico e montagem.", "Estender a outros processos e expedição.", "Todas estão corretas."], "correct": 3}, {"q": "Caso o Poka Yoke esteja reprovado:", "options": ["Aviso o responsável e sigo a produção.", "Abro OS e continuo trabalhando.", "Paro imediatamente até que ações sejam tomadas e realizo o registro em check list.", "Desligo o Poka Yoke."], "correct": 2}, {"q": "Princípios do DNA da Qualidade ZF:", "options": ["Pessoas, Princípios, Percepção, Produção, PDCA.", "Percepção, Prevenção, Performance, Produtividade, PDCA.", "Pessoas, Prevenção, Percepção, Performance, PDCA.", "Pessoas, Princípios, Produto, PDCA, Processo."], "correct": 2}, {"q": "Princípio Pessoas:", "options": ["Estrutura do DNA.", "Atuar no desenvolvimento dos colaboradores com foco em competência e cultura da qualidade.", "Analisar dados para decisão.", "Entender expectativas de clientes."], "correct": 1}, {"q": "Princípio Prevenção:", "options": ["Analisar dados.", "Assegurar o planejamento dos produtos, processos e serviços da ZF com foco no defeito zero.", "Desenvolvimento de colaboradores.", "Entender expectativas."], "correct": 1}, {"q": "Princípio Percepção:", "options": ["Entender a atender as expectativas dos clientes internos e externos.", "Focar em indicadores.", "Desenvolvimento de colaboradores.", "Lançamento robusto."], "correct": 0}, {"q": "Princípio Performance:", "options": ["Lançamento robusto.", "Desenvolvimento de colaboradores.", "Focar na definição e monitoramento dos indicadores da ZF, avaliando o desempenho, rumo à excelência em Qualidade.", "Entender expectativas."], "correct": 2}, {"q": "Princípio PDCA:", "options": ["A estrutura do DNA da Qualidade, trazendo a reflexão das lições aprendidas e o compartilhamento de boas práticas.", "Analisar dados.", "Planejamento com foco em defeito zero.", "Entender expectativas."], "correct": 0}, {"q": "Peças de setup reprovadas devem ser identificadas com:", "options": ["Cinta branca para retrabalho.", "Caixa de segregação ou Cinta plástica vermelha quando não for possível, devido ao tamanho das peças.", "Cinta vermelha sem re-inspeção.", "Cinta branca no fim do turno."], "correct": 1}, {"q": "O almoxarife deve verificar contaminação nas peças incluindo:", "options": ["Oxidação.", "Poeira.", "Óleo/graxa que interfira na qualidade.", "Todas estão corretas."], "correct": 3}, {"q": "Almoxarife deve armazenar peças em:", "options": ["Caçambas com madeira.", "Caixas KLT sujas.", "Recipientes limpos, livre de qualquer contaminante.", "Caçambas com água."], "correct": 2}, {"q": "Shutdown são paradas superiores a:", "options": ["10 dias úteis.", "10 dias corridos.", "12 dias corridos.", "12 dias úteis."], "correct": 1}, {"q": "Quality Alert auxilia na:", "options": ["Contenção / Prevenção de falhas internas e externas, de acordo com a complexidade da falha.", "Prevenção só interna.", "Prevenção só externa."], "correct": 0}, {"q": "No Shutdown, a Produção deve:", "options": ["Cobrir carrinhos e racks.", "Cobrir racks de componentes.", "Desligar equipamentos (salvo fornos).", "Todas estão corretas."], "correct": 3}, {"q": "Após Shutdown, é necessário:", "options": ["Validar Poka Yokes.", "Revalidar setups.", "Religar conforme prioridade.", "Todas estão corretas."], "correct": 3}, {"q": "Responsabilidade do usuário sobre meios de medição:", "options": ["Validade vencida.", "Falta de identificação.", "Mau funcionamento.", "Todas estão corretas."], "correct": 3}, {"q": "Poka Yoke identifica:", "options": ["Falta de operação.", "Peça montada errada.", "Peça não montada.", "Todas estão corretas."], "correct": 3}, {"q": "Principais casos de emissão de desvio:", "options": ["Fluxo do processo.", "Mudança de máquina.", "Poka Yoke.", "Todas estão corretas."], "correct": 3}, {"q": "Quando deve ser realizado o retrabalho (IT-GQ-007)?", "options": ["No momento do processo.", "Não precisa.", "Liberar para o cliente.", "Retornar o produto à linha para realizar seu retrabalho no fim do lote de processo."], "correct": 3}, {"q": "Preservação do produto (IATF) inclui:", "options": ["Identificação e manuseio.", "Armazenamento e embalagem.", "Transporte e proteção.", "Todas estão corretas."], "correct": // Time (ms) the answer stays highlighted before auto-advancing.
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  const order = shuffle(RAW_QUESTIONS.map((_,i)=>i));
  return order.map(i=>{
    const src = RAW_QUESTIONS[i];
    const idxs = shuffle(src.options.map((_,k)=>k));
    const options = idxs.map(k=>src.options[k]);
    const correct = idxs.indexOf(src.correct);
    return { num: i + 1, q: src.q, options, correct };
  });
}

let deck = buildDeck();
let pos = 0;
let locked = false;

const qText = document.getElementById('qText');
const qOptions = document.getElementById('qOptions');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizCard = document.getElementById('quizCard');
const resultCard = document.getElementById('resultCard');
const restartBtn = document.getElementById('restartBtn');
const startCard = document.getElementById('startCard');
const startBtn = document.getElementById('startBtn');

function renderQuestion(){
  locked = false;
  feedback.textContent = '';
  feedback.className = 'feedback-line';
  nextBtn.classList.add('hidden');

  const item = deck[pos];
  qText.textContent = item.num + ') ' + item.q;

  qOptions.innerHTML = '';
  item.options.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    btn.textContent = opt;
    btn.addEventListener('click', ()=>handleAnswer(idx, btn));
    qOptions.appendChild(btn);
  });
}

function handleAnswer(idx, btn){
  if(locked) return;
  locked = true;
  const item = deck[pos];
  const allBtns = Array.from(qOptions.children);
  allBtns.forEach(b=>b.disabled = true);

  if(idx === item.correct){
    btn.classList.add('correct');
    feedback.textContent = 'Correto!';
    feedback.classList.add('ok');
  } else {
    btn.classList.add('wrong');
    allBtns[item.correct].classList.add('correct');
    feedback.textContent = 'Incorreto. A resposta correta era:';
    feedback.classList.add('err');
  }

  nextBtn.classList.remove('hidden');
}

function goNext(){
  pos++;
  if(pos >= deck.length){
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult(){
  quizCard.classList.add('hidden');
  resultCard.classList.remove('hidden');
}

nextBtn.addEventListener('click', goNext);

restartBtn.addEventListener('click', ()=>{
  deck = buildDeck();
  pos = 0;
  resultCard.classList.add('hidden');
  quizCard.classList.remove('hidden');
  renderQuestion();
});

startBtn.addEventListener('click', ()=>{
  startCard.classList.add('hidden');
  quizCard.classList.remove('hidden');
  renderQuestion();
});
</script>
